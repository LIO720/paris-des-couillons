<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris PSG - Champions League</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex flex-col items-center">

    <!-- En-tête avec logo CL bien visible -->
    <header class="w-full max-w-sm text-center mb-6">
        <div class="bg-blue-900 p-4 rounded-2xl shadow-xl border border-blue-500 mb-4 flex items-center justify-center gap-3">
            <img src="https://upload.wikimedia.org/wikipedia/fr/thumb/b/bf/Logo_UEFA_Champions_League.svg/1200px-Logo_UEFA_Champions_League.svg.png" alt="CL" class="w-12 h-12 object-contain">
            <h1 class="text-xl font-black uppercase tracking-tighter">Champions League</h1>
        </div>
        
        <h2 class="text-3xl font-black uppercase text-white mb-2">Paris PSG</h2>
        <div class="bg-slate-800 border border-slate-600 rounded-xl px-6 py-2 inline-block">
            <p class="text-[10px] uppercase text-slate-400 font-bold">Cagnotte</p>
            <span class="text-2xl font-black text-amber-400" id="total-cagnotte">5 €</span>
        </div>
    </header>

    <!-- Carte principale -->
    <main class="w-full max-w-sm bg-slate-950 rounded-3xl p-6 shadow-2xl border border-slate-800">
        <div class="text-center mb-6">
            <p class="text-blue-400 text-xs font-bold uppercase tracking-widest mb-1">Prochain Match</p>
            <p class="text-amber-500 font-bold text-sm mb-4">Tirage au sort le 27 août</p>
            
            <!-- Logos clubs bien visibles -->
            <div class="flex items-center justify-center gap-6">
                <div class="flex flex-col items-center">
                    <img src="https://upload.wikimedia.org/wikipedia/fr/thumb/8/86/Paris_Saint-Germain_Logo.svg/1200px-Paris_Saint-Germain_Logo.svg.png" class="w-20 h-20 object-contain mb-2" alt="PSG">
                    <span class="font-bold">PSG</span>
                </div>
                <span class="text-2xl font-black text-slate-600">VS</span>
                <div class="flex flex-col items-center">
                    <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center border-2 border-dashed border-slate-600 mb-2 text-slate-500">?</div>
                    <span class="font-bold text-slate-500">À venir</span>
                </div>
            </div>
        </div>

        <form id="prono-form" class="space-y-4">
            <div class="text-center">
                <label class="block text-xs uppercase text-slate-400 mb-2">Votre Pronostic</label>
                <div class="flex justify-center items-center gap-4">
                    <input type="number" id="score-psg" required class="w-20 h-20 bg-slate-900 border-2 border-blue-600 rounded-3xl text-center text-3xl font-bold">
                    <span class="text-2xl font-black text-slate-700">-</span>
                    <input type="number" id="score-adv" required class="w-20 h-20 bg-slate-900 border-2 border-slate-600 rounded-3xl text-center text-3xl font-bold">
                </div>
            </div>
            
            <input type="number" id="minute" placeholder="Minute 1er but" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-center">
            <input type="text" id="nom" placeholder="Votre Prénom" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-center">
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black text-lg shadow-lg shadow-blue-900/50 uppercase tracking-widest">
                Valider mon prono
            </button>
        </form>
    </main>
</body>
</html>
