<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Paris des Couillons</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-10">

  <div class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- En-tête / Cagnotte -->
    <header class="bg-slate-950 border border-slate-800 rounded-2xl p-4 text-center space-y-2 shadow-xl">
      <h1 class="text-xl font-black text-amber-400 tracking-wide uppercase">Le Paris des Couillons</h1>
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 inline-block w-full">
        <span class="text-xs text-slate-400 uppercase font-bold tracking-wider block">Cagnotte actuelle</span>
        <span id="cagnotte" class="text-3xl font-black text-emerald-400">0 €</span>
      </div>
    </header>

    <!-- Navigation Onglets -->
    <nav class="flex gap-2 justify-center">
      <button id="btn-tab-pronos" onclick="switchTab('pronos')" class="px-3 py-2 rounded-xl text-[11px] font-bold uppercase tracking-wider transition bg-blue-600 text-white shadow-lg cursor-pointer">Pronos</button>
      <button id="btn-tab-infos" onclick="switchTab('infos')" class="px-3 py-2 rounded-xl text-[11px] font-bold uppercase tracking-wider transition bg-slate-900/90 text-slate-400 border border-slate-700 cursor-pointer">Infos Match</button>
      <button id="btn-tab-resultats" onclick="switchTab('resultats')" class="px-3 py-2 rounded-xl text-[11px] font-bold uppercase tracking-wider transition bg-slate-900/90 text-slate-400 border border-slate-700 cursor-pointer">Résultats J</button>
    </nav>

    <!-- Contenu Match -->
    <main class="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-4 shadow-xl">
      
      <!-- Affiche Equipes -->
      <div class="flex justify-between items-center text-center py-2">
        <div class="w-1/3 flex flex-col items-center gap-1">
          <img id="team-home-logo" src="https://media.api-sports.io/football/teams/85.png" class="w-10 h-10 object-contain drop-shadow-lg" alt="Home">
          <span id="team-home-name" class="text-xs font-bold leading-tight">PSG</span>
        </div>
        <div class="w-1/3 text-amber-400 font-black text-sm">VS</div>
        <div class="w-1/3 flex flex-col items-center gap-1">
          <img id="team-away-logo" src="" class="w-10 h-10 object-contain drop-shadow-lg" alt="Away">
          <span id="team-away-name" class="text-xs font-bold leading-tight">Chargement...</span>
        </div>
      </div>

      <!-- Compte à rebours -->
      <div class="text-center bg-slate-900/50 py-2 rounded-xl border border-slate-800">
        <span class="text-[10px] text-slate-400 uppercase font-semibold block">Coup d'envoi dans</span>
        <span id="countdown" class="text-sm font-extrabold text-blue-400">Chargement...</span>
      </div>

      <!-- Onglet 1 : Formulaire Prono -->
      <section id="tab-pronos" class="space-y-4">
        <form id="prono-form" class="space-y-3">
          <div>
            <label for="nom" class="block text-xs font-semibold text-slate-300 mb-1">Ton Nom / Pseudo</label>
            <input type="text" id="nom" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
          </div>
          
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label for="score1" class="block text-xs font-semibold text-slate-300 mb-1">Buts Domicile</label>
              <input type="number" id="score1" min="0" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-center text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
              <label for="score2" class="block text-xs font-semibold text-slate-300 mb-1">Buts Extérieur</label>
              <input type="number" id="score2" min="0" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-center text-white focus:outline-none focus:border-blue-500">
            </div>
          </div>

          <div>
            <label for="minute" class="block text-xs font-semibold text-slate-300 mb-1">Minute 1er But (départage)</label>
            <input type="number" id="minute" min="1" max="120" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-center text-white focus:outline-none focus:border-blue-500">
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-xl text-sm transition shadow-lg cursor-pointer">Valider mon pronostic</button>
        </form>
        <div id="status" class="text-center text-[11px] font-semibold"></div>

        <!-- Liste des parieurs -->
        <div class="pt-2 border-t border-slate-800 space-y-2">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Pronostiqueurs inscrits :</span>
          <div id="parieurs-list" class="flex flex-wrap gap-1.5">
            <span class="text-slate-400 italic text-[11px]">Chargement...</span>
          </div>
        </div>
      </section>

      <!-- Onglet 2 : Infos Match & Arbitre -->
      <section id="tab-infos" class="hidden space-y-3 text-xs">
        <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800 space-y-1.5">
          <div><span class="text-slate-400">Date :</span> <strong id="info-date" class="text-slate-200">...</strong></div>
          <div><span class="text-slate-400">Compétition :</span> <strong id="info-round" class="text-slate-200">...</strong></div>
          <div><span class="text-slate-400">Stade :</span> <strong id="info-stadium" class="text-slate-200">...</strong></div>
        </div>
        <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800 space-y-1.5">
          <div class="font-bold text-amber-400">Corps Arbitral</div>
          <div><span class="text-slate-400">Arbitre :</span> <strong id="info-referee" class="text-slate-200">...</strong> (<span id="info-referee-country" class="text-slate-300">...</span>)</div>
          <p id="info-referee-comment" class="text-[11px] text-slate-400 leading-relaxed italic border-t border-slate-800/80 pt-2 mt-2">...</p>
        </div>
      </section>

      <!-- Onglet 3 : Résultats des journées -->
      <section id="tab-resultats" class="hidden space-y-3">
        <div id="matchdays-nav" class="flex gap-1.5 overflow-x-auto pb-1"></div>
        <div id="ai-resultats-container" class="space-y-2"></div>
      </section>

    </main>
  </div>

  <script>
    const SUPABASE_URL = "https://bgcuxroguucumbveptvb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_MuYlr1whhZ7eFS1D8LoP7Q_0NV70N1X";
    const MISE_PAR_PERSONNE = 5;
    const API_FOOTBALL_KEY = '15a5eabb2d17b76fb922cd808a574779';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentFixtureId = null;
    let countdownInterval = null;

    function switchTab(tab) {
      const tabPronos = document.getElementById('tab-pronos');
      const tabInfos = document.getElementById('tab-infos');
      const tabResultats = document.getElementById('tab-resultats');
      
      const btnPronos = document.getElementById('btn-tab-pronos');
      const btnInfos = document.getElementById('btn-tab-infos');
      const btnResultats = document.getElementById('btn-tab-resultats');

      if (!tabPronos || !tabInfos || !tabResultats) return;

      tabPronos.classList.add('hidden');
      tabInfos.classList.add('hidden');
      tabResultats.classList.add('hidden');

      btnPronos.className = "px-3 py-2 rounded-xl text-[11px] font-bold uppercase tracking-wider transition bg-slate-900/90 text-slate-400 border border-slate-700 cursor-pointer";
      btnInfos.className = "px-3 py-2 rounded-xl text-[11px] font-bold uppercase tracking-wider transition bg-slate-900/90 text-slate-400 border border-slate-700 cursor-pointer";
      btnResultats.className = "px-3 py-2 rounded-xl text-[11px] font-bold uppercase tracking-wider transition bg-slate-900/90 text-slate-400 border border-slate-700 cursor-pointer";

      if (tab === 'pronos') {
        tabPronos.classList.remove('hidden');
        btnPronos.className = "px-3 py-2 rounded-xl text-[11px] font-bold uppercase tracking-wider transition bg-blue-600 text-white shadow-lg cursor-pointer";
      } else if (tab === 'infos') {
        tabInfos.classList.remove('hidden');
        btnInfos.className = "px-3 py-2 rounded-xl text-[11px] font-bold uppercase tracking-wider transition bg-blue-600 text-white shadow-lg cursor-pointer";
      } else if (tab === 'resultats') {
        tabResultats.classList.remove('hidden');
        btnResultats.className = "px-3 py-2 rounded-xl text-[11px] font-bold uppercase tracking-wider transition bg-blue-600 text-white shadow-lg cursor-pointer";
        initMatchdaysNav();
      }
    }

    async function fetchNextPSGMatch() {
      try {
        const response = await fetch("https://v3.football.api-sports.io/fixtures?team=85&next=1", {
          headers: { "x-apisports-key": API_FOOTBALL_KEY }
        });
        const data = await response.json();
        
        if (data.response && data.response.length > 0) {
          const match = data.response[0];
          currentFixtureId = match.fixture.id;
          const matchDate = new Date(match.fixture.date);
          
          document.getElementById('team-home-name').innerText = match.teams.home.name;
          document.getElementById('team-home-logo').src = match.teams.home.logo;
          
          document.getElementById('team-away-name').innerText = match.teams.away.name;
          document.getElementById('team-away-logo').src = match.teams.away.logo;

          document.getElementById('info-date').innerText = matchDate.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
          document.getElementById('info-round').innerText = match.league.round || 'Phase de ligue';

          const stadiumName = match.fixture.venue?.name || 'Stade non défini';
          const stadiumCity = match.fixture.venue?.city ? ` (${match.fixture.venue.city})` : '';
          document.getElementById('info-stadium').innerText = stadiumName + stadiumCity;

          if (match.fixture.referee) {
            const refParts = match.fixture.referee.split(',');
            const refName = refParts[0] ? refParts[0].trim() : match.fixture.referee;
            const refCountry = refParts[1] ? refParts[1].trim() : 'International';

            document.getElementById('info-referee').innerText = refName;
            document.getElementById('info-referee-country').innerText = refCountry;
            document.getElementById('info-referee-comment').innerText = generateRefereeAIComment(refName, refCountry);
          } else {
            document.getElementById('info-referee').innerText = 'En attente désignation UEFA';
            document.getElementById('info-referee-country').innerText = 'UEFA';
            document.getElementById('info-referee-comment').innerText = "L'UEFA n'a pas encore désigné le corps arbitral pour cette rencontre.";
          }

          startCountdown(matchDate);
          loadParieurs();
          return;
        }
      } catch (err) {
        console.error("Erreur API Football :", err);
      }

      document.getElementById('countdown').innerText = "Programmation UEFA en cours";
      document.getElementById('team-away-name').innerText = "Prochain adversaire";
      document.getElementById('info-date').innerText = "Date et heure en attente";
    }

    function generateRefereeAIComment(name, country) {
      const n = name.toLowerCase();
      if (n.includes('turpin')) return "Clément Turpin est un arbitre d'expérience internationale très respecté. Réputé pédagogue avec les capitaines, il privilégie la fluidité du jeu.";
      if (n.includes('marciniak')) return "Szymon Marciniak figure parmi l'élite mondiale. Avec un style très ferme, il laisse beaucoup jouer dans l'impact.";
      if (n.includes('taylor')) return "Anthony Taylor applique la tradition britannique avec une grande tolérance sur les duels physiques.";
      if (n.includes('letexier')) return "François Letexier incarne la nouvelle génération très dynamique et rigoureuse. Très à l'aise avec la VAR.";
      
      return `${name} (${country}) est un arbitre international sélectionné par l'UEFA pour les affiches de Ligue des Champions.`;
    }

    function startCountdown(targetDate) {
      if (countdownInterval) clearInterval(countdownInterval);

      countdownInterval = setInterval(() => {
        const now = new Date();
        const diff = targetDate - now;
        const el = document.getElementById('countdown');
        if (!el) return;

        if (diff <= 0) {
          el.innerText = "Match en cours ou terminé !";
          clearInterval(countdownInterval);
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const mins = Math.floor((diff / 1000 / 60) % 60);
        const secs = Math.floor((diff / 1000) % 60);

        el.innerText = `${days}j ${hours}h ${mins}m ${secs}s`;
      }, 1000);
    }

    function initMatchdaysNav() {
      const nav = document.getElementById('matchdays-nav');
      if (!nav || nav.children.length > 0) return;
      nav.innerHTML = '';

      for (let i = 1; i <= 8; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = "px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase transition bg-slate-800 text-slate-300 border border-slate-700 shrink-0 cursor-pointer hover:bg-slate-700";
        btn.innerText = "J" + i;
        btn.onclick = () => fetchMatchday(i);
        nav.appendChild(btn);
      }
      fetchMatchday(1);
    }

    async function fetchMatchday(dayNum) {
      const container = document.getElementById('ai-resultats-container');
      container.innerHTML = '<span class="text-slate-400 italic text-[11px] block text-center">Chargement Journée ' + dayNum + '...</span>';

      try {
        const url = 'https://v3.football.api-sports.io/fixtures?league=2&season=2026&round=League Stage - ' + dayNum;
        const response = await fetch(url, {
          headers: { "x-apisports-key": API_FOOTBALL_KEY }
        });
        const data = await response.json();

        if (data.response && data.response.length > 0) {
          container.innerHTML = data.response.map(m => {
            const homeGoals = m.goals.home !== null ? m.goals.home : '-';
            const awayGoals = m.goals.away !== null ? m.goals.away : '-';
            return '<div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3 flex justify-between items-center text-xs">' +
              '<span class="w-1/3 truncate font-semibold">' + m.teams.home.name + '</span>' +
              '<span class="text-amber-400 font-black">' + homeGoals + ' : ' + awayGoals + '</span>' +
              '<span class="w-1/3 text-right truncate font-semibold">' + m.teams.away.name + '</span>' +
            '</div>';
          }).join('');
          return;
        }
      } catch (err) {
        console.error("Erreur API :", err);
      }

      container.innerHTML = '<div class="bg-slate-950/70 border border-slate-800 rounded-2xl p-4 text-center space-y-1">' +
        '<div class="text-amber-400 font-bold text-xs uppercase">Journée ' + dayNum + '</div>' +
        '<p class="text-[11px] text-slate-400">Le calendrier officiel et la programmation des matchs sont en cours de confirmation par l\'UEFA.</p>' +
      '</div>';
    }

    async function loadParieurs() {
      if (!currentFixtureId) return;

      try {
        const { data, error } = await supabaseClient
          .from('pronostics')
          .select('*')
          .eq('fixture_id', currentFixtureId);

        const parieursList = document.getElementById('parieurs-list');
        const cagnotteEl = document.getElementById('cagnotte');

        if (error || !data) {
          if (parieursList) parieursList.innerHTML = '<span class="text-slate-400 italic text-[11px]">Aucun pari pour le moment</span>';
          if (cagnotteEl) cagnotteEl.innerText = '0 €';
          return;
        }

        const count = data.length;
        if (cagnotteEl) cagnotteEl.innerText = (count * MISE_PAR_PERSONNE) + ' €';

        if (count === 0) {
          if (parieursList) parieursList.innerHTML = '<span class="text-slate-400 italic text-[11px]">Aucun pari pour le moment</span>';
          return;
        }

        if (parieursList) {
          parieursList.innerHTML = data.map(p => 
            '<span class="bg-slate-800 text-slate-100 px-2.5 py-1 rounded-lg text-xs font-medium border border-slate-700 shadow">' + (p.nom_ami || 'Parieur') + '</span>'
          ).join('');
        }
      } catch (err) {}
    }

    const pronoForm = document.getElementById('prono-form');
    if (pronoForm) {
      pronoForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!currentFixtureId) {
          alert("Impossible d'enregistrer le pronostic : match non identifié.");
          return;
        }

        const status = document.getElementById('status');
        if (status) {
          status.innerText = "Validation...";
          status.className = "text-center text-[11px] font-semibold text-blue-400";
        }

        const nom = document.getElementById('nom').value.trim();
        const score1 = document.getElementById('score1').value;
        const score2 = document.getElementById('score2').value;
        const minute = parseInt(document.getElementById('minute').value);
        const scoreParier = score1 + '-' + score2;

        try {
          const { error } = await supabaseClient.from('pronostics').insert([
            { 
              nom_ami: nom, 
              score_parier: scoreParier, 
              minute_1er_but: minute,
              fixture_id: currentFixtureId
            }
          ]);

          if (error) {
            if (status) {
              status.innerText = "Erreur : " + error.message;
              status.className = "text-center text-[11px] font-semibold text-red-400";
            }
          } else {
            if (status) {
              status.innerText = "Prono enregistré avec succès ! 🎉";
              status.className = "text-center text-[11px] font-semibold text-green-400";
            }
            pronoForm.reset();
            loadParieurs();
          }
        } catch (err) {
          if (status) {
            status.innerText = "Erreur de connexion.";
            status.className = "text-center text-[11px] font-semibold text-red-400";
          }
        }
      });
    }

    fetchNextPSGMatch();
  </script>
</body>
</html>
