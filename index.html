<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Paris des Couillons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 font-sans">
    <div class="max-w-md mx-auto space-y-6">
        <header class="text-center my-6">
            <h1 class="text-3xl font-extrabold text-amber-400">🏆 Paris des Couillons</h1>
            <p class="text-slate-400 text-sm mt-1">Pronostics PSG & Cagnotte en jeu</p>
        </header>

        <main class="bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700 space-y-4">
            <h2 class="text-xl font-bold border-b border-slate-700 pb-2">Prochain Match</h2>
            <div id="match-info" class="text-center py-4 text-slate-300">Chargement du match...</div>
            
            <form id="prono-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium mb-1">Votre Prénom</label>
                    <input type="text" id="nom" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Score (ex: 2-1)</label>
                    <input type="text" id="score" required placeholder="2-1" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Minute du 1er but</label>
                    <input type="number" id="minute" required placeholder="24" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 font-bold py-2 rounded transition">Valider mon prono</button>
            </form>
        </main>
    </div>
</body>
</html>
