<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Champions Predict - Application Pronostics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { 900: '#0b0f19', 950: '#05070b' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-p-6 antialiased">

  <div class="max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- En-tête & Cagnotte -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-slate-900/80 border border-slate-800 p-6 rounded-3xl backdrop-blur-md gap-4 shadow-xl">
      <div>
        <h1 class="text-xl font-black uppercase tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">
          🏆 Champions Predict
        </h1>
        <p class="text-xs text-slate-400 mt-1">Phase de Ligue • Saison 2026</p>
      </div>
      <div class="bg-slate-950 border border-amber-500/30 px-5 py-3 rounded-2xl text-center shadow-inner">
        <span class="block text-[10px] uppercase font-bold tracking-widest text-amber-400">Cagnotte en jeu</span>
        <span id="jackpot-amount" class="text-lg font-mono font-black text-amber-300">1 500 €</span>
      </div>
    </header>

    <!-- Section Matchs / Pronostics -->
    <section class="bg-slate-900/60 border border-slate-800 p-6 rounded-3xl space-y-4">
      <h2 class="text-xs font-bold text-blue-400 uppercase tracking-widest">Matchs de la Journée</h2>
      
      <div id="matches-container" class="space-y-3">
        <!-- Chargement dynamique -->
        <div class="text-center py-8 text-slate-500 text-xs">Chargement du calendrier...</div>
      </div>
    </section>

    <!-- Analyse / Commentaire de l'Arbitre IA -->
    <section class="bg-gradient-to-br from-indigo-950/40 to-slate-900/60 border border-indigo-900/40 p-6 rounded-3xl space-y-3">
      <div class="flex items-center space-x-2">
        <span class="text-lg">🤖</span>
        <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-widest">L'œil de l'Arbitre (IA)</h2>
      </div>
      <p id="ai-commentary" class="text-xs text-slate-300 italic bg-slate-950/50 p-4 rounded-2xl border border-slate-800/80">
        "Salut l'artiste ! Prépare tes pronos, la minute décisive fera toute la différence pour rafler la cagnotte ce soir."
      </p>
    </section>

  </div>

  <!-- Modale Fiche Club -->
  <div id="club-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl p-6 relative space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
      <button onclick="closeClubModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800/60 hover:bg-slate-800 w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition">✕</button>
      <div id="club-modal-content" class="space-y-4">
        <!-- Contenu injecté dynamiquement -->
      </div>
    </div>
  </div>

  <script>
    // Remplace par ta clé API-Football valide
    const API_FOOTBALL_KEY = 'TA_CLE_API_FOOTBALL';

    // Exemple de chargement des clubs pour la modale
    async function openClubModal(teamId) {
      const modal = document.getElementById('club-modal');
      const content = document.getElementById('club-modal-content');
      if (!modal || !content) return;

      modal.classList.remove('hidden');
      content.innerHTML = `<div class="text-center py-12"><div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div><p class="text-xs text-slate-400 mt-3">Chargement des détails...</p></div>`;

      try {
        const [resTeam, resStats, resSquad] = await Promise.all([
          fetch(`https://v3.football.api-sports.io/teams?id=${teamId}`, { headers: { "x-apisports-key": API_FOOTBALL_KEY } }),
          fetch(`https://v3.football.api-sports.io/teams/statistics?league=2&season=2026&team=${teamId}`, { headers: { "x-apisports-key": API_FOOTBALL_KEY } }),
          fetch(`https://v3.football.api-sports.io/squads?team=${teamId}`, { headers: { "x-apisports-key": API_FOOTBALL_KEY } })
        ]);

        const dataTeam = await resTeam.json();
        const dataStats = await resStats.json();
        const dataSquad = await resSquad.json();

        if (dataTeam.response && dataTeam.response.length > 0) {
          const item = dataTeam.response[0];
          const team = item.team;
          const venue = item.venue;
          const stats = dataStats.response || null;
          const squadList = dataSquad.response && dataSquad.response.length > 0 ? dataSquad.response[0].players : [];

          content.innerHTML = `
            <div class="flex items-center space-x-4 bg-slate-950/70 p-4 rounded-2xl border border-slate-800">
              <img src="${team.logo}" alt="${team.name}" class="w-16 h-16 object-contain">
              <div>
                <h2 class="text-base font-black text-white uppercase">${team.name}</h2>
                <p class="text-xs text-slate-400">Pays : <span class="text-slate-200 font-semibold">${team.country}</span> | Fondé : <span class="text-slate-200 font-semibold">${team.founded || 'N/C'}</span></p>
              </div>
            </div>

            ${venue ? `
            <div class="bg-slate-950/70 p-4 rounded-2xl border border-slate-800 space-y-2">
              <h3 class="text-[11px] font-bold text-blue-400 uppercase tracking-wider">Stade Officiel</h3>
              <div class="flex justify-between text-xs"><span class="text-slate-400">Nom</span><span class="font-semibold text-white">${venue.name}</span></div>
              <div class="flex justify-between text-xs"><span class="text-slate-400">Capacité</span><span class="font-semibold text-amber-400">${venue.capacity ? venue.capacity.toLocaleString() + ' places' : 'N/C'}</span></div>
              ${venue.image ? `<img src="${venue.image}" class="w-full h-32 object-cover rounded-xl mt-2 border border-slate-800" alt="Stade">` : ''}
            </div>` : ''}

            <div class="bg-slate-950/70 p-4 rounded-2xl border border-slate-800 space-y-3">
              <h3 class="text-[11px] font-bold text-blue-400 uppercase tracking-wider">Statistiques (Champions League)</h3>
              <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                  <span class="block text-[10px] text-slate-400">Forme</span>
                  <span class="text-xs font-mono font-bold text-slate-200">${stats && stats.form ? stats.form : 'En cours'}</span>
                </div>
                <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                  <span class="block text-[10px] text-slate-400">Clean Sheets</span>
                  <span class="text-xs font-bold text-emerald-400">${stats && stats.clean_sheet ? stats.clean_sheet.total : 0}</span>
                </div>
                <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                  <span class="block text-[10px] text-slate-400">Buts</span>
                  <span class="text-xs font-bold text-amber-400">${stats && stats.goals ? stats.goals.for.total.total : 0}</span>
                </div>
              </div>
            </div>

            <div class="bg-slate-950/70 p-4 rounded-2xl border border-slate-800 space-y-3">
              <h3 class="text-[11px] font-bold text-blue-400 uppercase tracking-wider">Effectif (${squadList.length} joueurs)</h3>
              <div class="max-h-56 overflow-y-auto space-y-1.5 pr-1">
                ${squadList.length > 0 ? squadList.map(p => `
                  <div class="flex items-center justify-between bg-slate-900 p-2 rounded-xl border border-slate-800 text-xs">
                    <div class="flex items-center space-x-2.5">
                      <img src="${p.photo}" class="w-7 h-7 rounded-full object-cover bg-slate-800" alt="">
                      <div>
                        <span class="font-bold text-slate-200 block truncate max-w-[180px]">${p.name}</span>
                        <span class="text-[10px] text-slate-400">${p.position} ${p.number ? '• #' + p.number : ''}</span>
                      </div>
                    </div>
                    <span class="text-[11px] text-slate-400">${p.age ? p.age + ' ans' : ''}</span>
                  </div>
                `).join('') : '<p class="text-xs text-slate-400 italic text-center py-2">Effectif non disponible.</p>'}
              </div>
            </div>
          `;
        } else {
          content.innerHTML = `<p class="text-xs text-red-400 text-center py-6">Impossible de charger les données.</p>`;
        }
      } catch (err) {
        content.innerHTML = `<p class="text-xs text-red-400 text-center py-6">Erreur réseau.</p>`;
      }
    }

    function closeClubModal() {
      document.getElementById('club-modal').classList.add('hidden');
    }
  </script>
</body>
</html>
