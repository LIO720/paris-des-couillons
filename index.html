<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paris PSG – Champions League</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

  <!-- Arrière-plan Stade de Football avec pelouse verte naturelle -->
  <div class="fixed inset-0 z-0 bg-cover bg-center bg-no-repeat scale-105" 
       style="background-image: url('https://images.unsplash.com/photo-1518604668838-89a1f24d7b6f?q=80&w=2070&auto=format&fit=crop');">
    <div class="absolute inset-0 bg-slate-950/75 backdrop-blur-[1px]"></div>
  </div>

  <div class="w-full max-w-md space-y-6 relative z-10">
    
    <!-- En-tête : Bannière Champions League blanche sur toute la largeur -->
    <div class="text-center space-y-3">
      <div class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-blue-900/90 via-blue-800 to-blue-900/90 border border-blue-500/50 shadow-2xl backdrop-blur-md flex items-center justify-center space-x-3">
        <img src="https://media.api-sports.io/football/leagues/2.png" alt="UEFA Champions League" class="w-12 h-12 object-contain filter brightness-0 invert drop-shadow-[0_0_12px_rgba(255,255,255,0.9)]">
        <span class="text-lg font-black tracking-widest text-white uppercase drop-shadow-md">Champions League</span>
      </div>

      <h1 class="text-2xl font-black tracking-wider uppercase text-white drop-shadow-md">PARIS PSG</h1>
      
      <!-- Cagnotte -->
      <div class="inline-block mt-1 px-6 py-2 rounded-xl bg-slate-900/90 border border-slate-700/80 shadow-lg backdrop-blur-md">
        <span class="block text-[10px] text-slate-400 uppercase tracking-widest font-bold">Cagnotte</span>
        <span id="cagnotte" class="text-xl font-black text-amber-400">0 €</span>
      </div>
    </div>

    <!-- Carte du Match -->
    <main class="bg-slate-900/85 border border-slate-700/60 rounded-3xl p-6 backdrop-blur-xl shadow-2xl space-y-6">
      
      <div class="text-center space-y-1">
        <span id="match-subtitle" class="text-[11px] font-bold tracking-widest text-blue-400 uppercase">PROCHAIN MATCH</span>
        <p class="text-xs text-slate-300">Coup d'envoi dans</p>
        <div id="countdown" class="text-lg font-black text-amber-400 py-1">
          Tirage au sort le 27 août
        </div>
      </div>

      <!-- Équipes -->
      <div class="flex items-center justify-between px-4 py-3 bg-slate-950/70 rounded-2xl border border-slate-800 shadow-inner">
        
        <!-- Gauche (Domicile) -->
        <div class="flex flex-col items-center space-y-2 w-1/3 text-center">
          <img id="team-home-logo" src="https://media.api-sports.io/football/teams/85.png" alt="PSG" class="w-14 h-14 object-contain filter drop-shadow-lg">
          <span id="team-home-name" class="text-xs font-bold text-slate-200 truncate w-full">PSG</span>
        </div>

        <!-- VS -->
        <div class="text-xs font-black text-slate-400 tracking-widest">VS</div>

        <!-- Droite (Extérieur) -->
        <div class="flex flex-col items-center space-y-2 w-1/3 text-center">
          <img id="team-away-logo" src="https://media.api-sports.io/football/leagues/2.png" alt="Champions League" class="w-12 h-12 object-contain filter drop-shadow">
          <span id="team-away-name" class="text-xs font-bold text-slate-300 truncate w-full">À venir</span>
        </div>

      </div>

      <!-- Formulaire Pronostic -->
      <form id="prono-form" class="space-y-4">
        <div class="text-center">
          <label class="text-[11px] font-bold text-slate-300 uppercase tracking-wider block mb-2">Votre Pronostic</label>
          <div class="flex items-center justify-center space-x-3">
            <input type="number" id="score1" min="0" max="20" required value="0" class="w-16 h-12 text-center text-xl font-bold bg-slate-950/90 border border-slate-700 rounded-xl focus:border-blue-500 focus:outline-none transition">
            <span class="text-slate-400 font-bold">-</span>
            <input type="number" id="score2" min="0" max="20" required value="0" class="w-16 h-12 text-center text-xl font-bold bg-slate-950/90 border border-slate-700 rounded-xl focus:border-blue-500 focus:outline-none transition">
          </div>
        </div>

        <div>
          <input type="text" id="minute" placeholder="Minute du 1er but" class="w-full bg-slate-950/90 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-center focus:border-blue-500 focus:outline-none placeholder-slate-400 transition">
        </div>

        <div>
          <input type="text" id="nom" required placeholder="Votre Prénom" class="w-full bg-slate-950/90 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-center focus:border-blue-500 focus:outline-none placeholder-slate-400 transition">
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 text-xs uppercase tracking-wider rounded-xl transition shadow-lg shadow-blue-600/30 active:scale-[0.98]">
          Valider mon prono
        </button>
      </form>

      <div id="status" class="text-center text-[11px] font-semibold"></div>

      <!-- Parieurs -->
      <div class="border-t border-slate-800 pt-4">
        <h2 class="text-slate-300 text-[11px] uppercase font-bold tracking-wider text-center mb-2.5">Qui a parié ?</h2>
        <div id="parieurs-list" class="flex flex-wrap gap-1.5 justify-center">
          <span class="text-slate-400 italic text-[11px]">Chargement...</span>
        </div>
      </div>

    </main>

  </div>

  <script>
    const SUPABASE_URL = "https://bgcuxroguucumbveptvb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_MuYlr1whhZ7eFS1D8LoP7Q_0NV70N1X";
    const MISE_PAR_PERSONNE = 5;

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let matchDateTarget = null;

    async function fetchNextMatch() {
      try {
        const response = await fetch('/api/next-match');
        const data = await response.json();

        if (data && data.fixture && data.teams) {
          document.getElementById('team-home-logo').src = data.teams.home.logo;
          document.getElementById('team-home-name').innerText = data.teams.home.name;

          document.getElementById('team-away-logo').src = data.teams.away.logo;
          document.getElementById('team-away-name').innerText = data.teams.away.name;

          if (data.league && data.league.round) {
            document.getElementById('match-subtitle').innerText = data.league.round;
          }

          matchDateTarget = new Date(data.fixture.date).getTime();
          startCountdown();
        } else {
          showWaitingState();
        }
      } catch (err) {
        showWaitingState();
      }
    }

    function showWaitingState() {
      document.getElementById('countdown').innerText = "Tirage au sort le 27 août";
      document.getElementById('team-home-logo').src = "https://media.api-sports.io/football/teams/85.png";
      document.getElementById('team-home-name').innerText = "PSG";
      document.getElementById('team-away-logo').src = "https://media.api-sports.io/football/leagues/2.png";
      document.getElementById('team-away-name').innerText = "À venir";
    }

    function startCountdown() {
      if (!matchDateTarget) return;
      
      const updateTimer = () => {
        const now = new Date().getTime();
        const diff = matchDateTarget - now;

        if (diff <= 0) {
          document.getElementById('countdown').innerText = "Match en cours ou terminé";
          return;
        }

        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('countdown').innerText = 
          `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      };

      updateTimer();
      setInterval(updateTimer, 1000);
    }

    async function loadParieurs() {
      const { data, error } = await supabaseClient.from('pronostics').select('*');
      if (error) {
        console.error("Erreur Supabase :", error);
        document.getElementById('parieurs-list').innerHTML = `<span class="text-red-400 text-[11px]">${error.message}</span>`;
        return;
      }

      const count = data ? data.length : 0;
      document.getElementById('cagnotte').innerText = `${count * MISE_PAR_PERSONNE} €`;

      if (!data || count === 0) {
        document.getElementById('parieurs-list').innerHTML = `<span class="text-slate-400 italic text-[11px]">Aucun pari pour le moment</span>`;
        return;
      }

      document.getElementById('parieurs-list').innerHTML = data.map(p => 
        `<span class="bg-slate-800 text-slate-100 px-2.5 py-1 rounded-lg text-xs font-medium border border-slate-700 shadow">${p.nom || p.name || 'Parieur'}</span>`
      ).join('');
    }

    document.getElementById('prono-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status');
      status.innerText = "Validation...";
      status.className = "text-center text-[11px] font-semibold text-blue-400";

      const nom = document.getElementById('nom').value.trim();
      const score1 = parseInt(document.getElementById('score1').value);
      const score2 = parseInt(document.getElementById('score2').value);
      const minute = document.getElementById('minute').value.trim();

      // On s'adapte aux colonnes exactes si besoin, ou on envoie les deux formats standards les plus fréquents
      const payload = {
        nom: nom,
        score_psg: score1,
        score_adv: score2,
        minute_premier_but: minute
      };

      const { error } = await supabaseClient.from('pronostics').insert([payload]);

      if (error) {
        status.innerText = "Erreur : " + error.message;
        status.className = "text-center text-[11px] font-semibold text-red-400";
      } else {
        status.innerText = "Prono enregistré avec succès ! 🎉";
        status.className = "text-center text-[11px] font-semibold text-green-400";
        document.getElementById('prono-form').reset();
        loadParieurs();
      }
    });

    fetchNextMatch();
    loadParieurs();
  </script>
</body>
</html>
