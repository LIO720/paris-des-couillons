<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris PSG - Champions League</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center p-4 font-sans relative">
    
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-950 via-slate-950 to-black opacity-80 pointer-events-none z-0"></div>

    <div class="w-full max-w-sm space-y-5 relative z-10 py-6">
        
        <!-- En-tête -->
        <header class="text-center space-y-2">
            <div class="flex justify-center">
                <div class="w-16 h-16 bg-gradient-to-br from-blue-900 to-indigo-700 rounded-full flex items-center justify-center border-2 border-blue-400 shadow-lg shadow-blue-500/30">
                    <span class="text-2xl">🏆</span>
                </div>
            </div>
            <h1 class="text-xl font-black tracking-wider text-white uppercase border-b-2 border-red-600 inline-block pb-1">Paris PSG</h1>
            <p id="league-name" class="text-blue-300 text-[11px] font-bold uppercase tracking-widest">Champions League</p>
            
            <div class="pt-1">
                <div class="bg-slate-900/80 border border-slate-700 rounded-2xl px-4 py-2 inline-block shadow-lg">
                    <p class="text-[9px] tracking-widest text-slate-400 uppercase font-bold">Cagnotte</p>
                    <div class="text-lg font-black text-amber-400"><span id="total-cagnotte">0</span> €</div>
                </div>
            </div>
        </header>

        <!-- Carte principale du match -->
        <main class="bg-slate-900/90 backdrop-blur-md rounded-3xl p-5 shadow-2xl border border-slate-800 space-y-5">
            
            <!-- Info Match & Compte à rebours dynamique -->
            <div class="text-center space-y-1.5">
                <div id="match-round" class="text-[10px] font-bold text-blue-400 tracking-widest uppercase">Prochain Match</div>
                <div class="text-[11px] text-slate-500">Coup d'envoi dans</div>
                <div id="countdown" class="text-base font-mono font-bold text-amber-400 tracking-wider">Chargement...</div>
                
                <!-- Équipes dynamiques avec vrais logos API-Sports -->
                <div class="flex items-center justify-center space-x-4 pt-3">
                    <!-- Équipe Domicile -->
                    <div class="flex flex-col items-center space-y-1 w-24">
                        <img id="home-logo" src="https://media.api-sports.io/football/teams/85.png" class="w-12 h-12 object-contain filter drop-shadow-md" alt="Domicile">
                        <span id="home-name" class="text-[11px] font-bold text-center truncate max-w-full">PSG</span>
                    </div>

                    <span class="text-slate-500 font-bold text-xs pb-4">VS</span>

                    <!-- Équipe Extérieur -->
                    <div class="flex flex-col items-center space-y-1 w-24">
                        <img id="away-logo" src="https://via.placeholder.com/48" class="w-12 h-12 object-contain filter drop-shadow-md" alt="Extérieur">
                        <span id="away-name" class="text-[11px] font-bold text-center truncate max-w-full">Adversaire</span>
                    </div>
                </div>
            </div>
            
            <!-- Formulaire de pronostic -->
            <form id="prono-form" class="space-y-3.5 pt-1">
                <div class="text-center space-y-1.5">
                    <label id="score-label" class="block text-[11px] font-semibold uppercase tracking-wider text-blue-300">Votre Pronostic</label>
                    <div class="flex items-center justify-center space-x-3">
                        <input type="number" id="score-home" min="0" required placeholder="0" class="w-14 h-14 bg-slate-950 border border-slate-700 rounded-2xl text-center text-xl font-bold text-white focus:outline-none focus:border-blue-500">
                        <span class="text-lg font-bold text-slate-600">-</span>
                        <input type="number" id="score-away" min="0" required placeholder="0" class="w-14 h-14 bg-slate-950 border border-slate-700 rounded-2xl text-center text-xl font-bold text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <input type="number" id="minute" min="1" max="120" required placeholder="Minute du 1er but" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <input type="text" id="nom" required placeholder="Votre Prénom" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>

                <button type="submit" class="w-full bg-blue-700 hover:bg-blue-600 font-bold py-3 rounded-xl transition shadow-lg shadow-blue-900/40 text-xs tracking-wider uppercase text-white">
                    Valider mon prono
                </button>
            </form>

            <div id="status" class="text-center text-[11px] font-semibold mt-1"></div>

            <!-- Liste des parieurs -->
            <div class="border-t border-slate-800/80 pt-4 mt-2">
                <h2 class="text-slate-400 text-[11px] uppercase font-bold mb-2.5 tracking-wider text-center">Qui a parié ?</h2>
                <div id="parieurs-list" class="flex flex-wrap gap-1.5 justify-center">
                    <span class="text-slate-500 italic text-[11px]">Chargement...</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = "https://bgcuxroguucumbveptvb.supabase.co";
        const SUPABASE_KEY = "VOTRE_sb_publishable_MuYlr1whhZ7eFS1D8LoP7Q_0NV70N1X"; 
        const MISE_PAR_PERSONNE = 5;

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let matchDateTarget = null;

        async function fetchNextMatch() {
            try {
                const response = await fetch('/api/next-match');
                const data = await response.json();

                if (data.error) {
                    console.error("Erreur API-Sports:", data.error);
                    document.getElementById('countdown').innerText = "Match à venir";
                    return;
                }

                document.getElementById('home-name').innerText = data.home.name;
                document.getElementById('home-logo').src = data.home.logo;

                document.getElementById('away-name').innerText = data.away.name;
                document.getElementById('away-logo').src = data.away.logo;

                document.getElementById('league-name').innerText = data.league;
                document.getElementById('match-round').innerText = data.round || "UEFA Champions League";

                matchDateTarget = new Date(data.date).getTime();
                updateCountdown();
                setInterval(updateCountdown, 1000);

            } catch (e) {
                console.error("Erreur lors de la récupération du match :", e);
            }
        }

        function updateCountdown() {
            if (!matchDateTarget) return;

            const now = new Date().getTime();
            const diff = matchDateTarget - now;

            if (diff <= 0) {
                document.getElementById('countdown').innerText = "MATCH EN COURS OU FINI";
                return;
            }

            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('countdown').innerText = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        async function loadParticipants() {
            const { data, error } = await supabaseClient
                .from('pronostics')
                .select('nom_ami');

            const listEl = document.getElementById('parieurs-list');
            const cagnotteEl = document.getElementById('total-cagnotte');

            if (error) {
                listEl.innerHTML = `<span class="text-red-400 text-[11px]">Erreur chargement</span>`;
                return;
            }

            if (data.length === 0) {
                listEl.innerHTML = `<span class="text-slate-500 text-[11px] italic">Aucun pari pour le moment.</span>`;
                cagnotteEl.innerText = "0";
            } else {
                listEl.innerHTML = data.map(p => `<span class="bg-slate-950 border border-slate-800 text-blue-300 px-2.5 py-1 rounded-lg text-[11px] font-semibold">${p.nom_ami}</span>`).join('');
                cagnotteEl.innerText = data.length * MISE_PAR_PERSONNE;
            }
        }

        fetchNextMatch();
        loadParticipants();

        document.getElementById('prono-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            status.className = "text-center text-[11px] font-semibold mt-1 text-blue-400";
            status.innerText = "Enregistrement en cours...";

            const nom = document.getElementById('nom').value;
            const scoreHome = document.getElementById('score-home').value;
            const scoreAway = document.getElementById('score-away').value;
            const scoreTotal = `${scoreHome}-${scoreAway}`; 
            const minute = parseInt(document.getElementById('minute').value);

            const { data, error } = await supabaseClient
                .from('pronostics')
                .insert([{ 
                    nom_ami: nom, 
                    score_parier: scoreTotal, 
                    minute_1er_but: minute 
                }]);

            if (error) {
                status.className = "text-center text-[11px] font-semibold mt-1 text-red-400";
                status.innerText = "Erreur : " + error.message;
            } else {
                status.className = "text-center text-[11px] font-semibold mt-1 text-green-400";
                status.innerText = "Pronostic enregistré avec succès ! 🎉";
                e.target.reset();
                loadParticipants(); 
            }
        });
    </script>
</body>
</html>
