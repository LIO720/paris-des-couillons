<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paris des Couillons – Champions League</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center p-4">

  <!-- Arrière-plan -->
  <div class="fixed inset-0 z-0 bg-slate-900 bg-cover bg-center bg-no-repeat" 
       style="background-color: #064e3b; background-image: linear-gradient(to bottom, rgba(3, 7, 18, 0.8), rgba(2, 44, 34, 0.85)), url('https://images.unsplash.com/photo-1518604668838-89a1f24d7b6f?q=80&w=2070&auto=format&fit=crop');">
  </div>

  <div class="w-full max-w-md relative z-10 space-y-6">
    
    <!-- En-tête -->
    <div class="text-center space-y-3">
      <div class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-blue-900/90 via-blue-800 to-blue-900/90 border border-blue-500/50 shadow-2xl backdrop-blur-md flex items-center justify-center space-x-3">
        <img src="https://media.api-sports.io/football/leagues/2.png" alt="UEFA Champions League" class="w-10 h-10 object-contain filter brightness-0 invert drop-shadow-[0_0_10px_rgba(255,255,255,0.9)]">
        <span class="text-lg font-black tracking-widest text-white uppercase">Champions League</span>
      </div>

      <h1 class="text-xl font-black tracking-wider uppercase text-white">Le Paris des Couillons</h1>
      
      <!-- Onglets -->
      <div class="flex justify-center space-x-2 pt-2">
        <button type="button" onclick="switchTab('pronos')" id="btn-tab-pronos" class="px-4 py-2 rounded-xl text-xs font-bold uppercase transition bg-blue-600 text-white shadow-lg">Pronos</button>
        <button type="button" onclick="switchTab('infos')" id="btn-tab-infos" class="px-4 py-2 rounded-xl text-xs font-bold uppercase transition bg-slate-900/90 text-slate-400 border border-slate-700">Infos</button>
        <button type="button" onclick="switchTab('resultats')" id="btn-tab-resultats" class="px-4 py-2 rounded-xl text-xs font-bold uppercase transition bg-slate-900/90 text-slate-400 border border-slate-700">Résultats</button>
      </div>
    </div>

    <!-- Conteneur Principal -->
    <div class="bg-slate-900/90 border border-slate-700/60 rounded-3xl p-6 backdrop-blur-xl shadow-2xl">
      
      <!-- ONGLET 1 : PRONOS -->
      <div id="tab-pronos" class="space-y-6">
        <div class="text-center">
          <p class="text-xs text-slate-400 font-bold uppercase">Prochain match dans</p>
          <div id="countdown" class="text-xl font-black text-amber-400">Tirage le 27 août</div>
        </div>
        
        <div class="flex items-center justify-between px-4 py-3 bg-slate-950/70 rounded-2xl border border-slate-800">
           <img id="team-home-logo" src="https://media.api-sports.io/football/teams/85.png" class="w-12 h-12 object-contain">
           <span class="text-slate-400 font-bold">VS</span>
           <img id="team-away-logo" src="https://media.api-sports.io/football/leagues/2.png" class="w-12 h-12 object-contain filter brightness-0 invert">
        </div>

        <form id="prono-form" class="space-y-3">
          <div class="flex justify-center items-center space-x-3">
            <input type="number" id="score1" required value="0" class="w-16 h-12 text-center text-xl font-bold bg-slate-950 border border-slate-700 rounded-xl">
            <span class="text-slate-500 font-bold">-</span>
            <input type="number" id="score2" required value="0" class="w-16 h-12 text-center text-xl font-bold bg-slate-950 border border-slate-700 rounded-xl">
          </div>
          <input type="number" id="minute" required placeholder="Minute 1er but" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-center">
          <input type="text" id="nom" required placeholder="Votre Prénom" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-center">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 text-sm uppercase rounded-xl">Valider</button>
        </form>
        <div id="status" class="text-center text-xs font-semibold"></div>
      </div>

      <!-- ONGLET 2 : INFOS (Caché par défaut) -->
      <div id="tab-infos" class="hidden space-y-4">
        <h2 class="text-center font-bold text-blue-400 uppercase text-xs">Infos Match</h2>
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs text-slate-300">
          <p>Compétition : UEFA Champions League</p>
          <p>Tirage au sort le 27 août</p>
        </div>
      </div>

      <!-- ONGLET 3 : RÉSULTATS (Caché par défaut) -->
      <div id="tab-resultats" class="hidden space-y-4">
        <h2 class="text-center font-bold text-blue-400 uppercase text-xs">Résultats & Analyse</h2>
        <div id="ai-resultats-container" class="text-center text-slate-400 text-xs italic">Aucun résultat.</div>
      </div>

    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('tab-pronos').classList.add('hidden');
      document.getElementById('tab-infos').classList.add('hidden');
      document.getElementById('tab-resultats').classList.add('hidden');
      
      document.getElementById('btn-tab-pronos').className = "px-4 py-2 rounded-xl text-xs font-bold uppercase transition bg-slate-900/90 text-slate-400 border border-slate-700";
      document.getElementById('btn-tab-infos').className = "px-4 py-2 rounded-xl text-xs font-bold uppercase transition bg-slate-900/90 text-slate-400 border border-slate-700";
      document.getElementById('btn-tab-resultats').className = "px-4 py-2 rounded-xl text-xs font-bold uppercase transition bg-slate-900/90 text-slate-400 border border-slate-700";

      document.getElementById('tab-' + tab).classList.remove('hidden');
      document.getElementById('btn-tab-' + tab).className = "px-4 py-2 rounded-xl text-xs font-bold uppercase transition bg-blue-600 text-white shadow-lg";
    }

    document.getElementById('prono-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const status = document.getElementById('status');
        status.innerText = "Enregistrement...";
        
        // Simuler l'envoi
        setTimeout(() => {
            status.innerText = "Prono enregistré ! 🎉";
            status.classList.add('text-green-400');
        }, 1000);
    });
  </script>
</body>
</html>
