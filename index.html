<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Paris des Couillons</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0b132b; color: #ffffff; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-[#1c2541] rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
    
    <div class="p-6 text-center border-b border-slate-700">
      <h1 class="text-2xl font-extrabold tracking-wider text-amber-400 uppercase">Le Paris des Couillons</h1>
      <div class="mt-4 bg-[#0b132b] p-4 rounded-xl border border-slate-800">
        <span class="text-xs uppercase tracking-widest text-slate-400 block mb-1">Cagnotte Actuelle</span>
        <span id="cagnotte-amount" class="text-3xl font-black text-emerald-400">0 €</span>
      </div>
    </div>

    <div class="flex border-b border-slate-700 bg-[#0b132b]/50">
      <button id="tab-prono" onclick="switchTab('prono')" class="flex-1 py-3 text-sm font-bold text-center border-b-2 border-blue-500 text-blue-400">PRONOS</button>
      <button id="tab-infos" onclick="switchTab('infos')" class="flex-1 py-3 text-sm font-bold text-center border-b-2 border-transparent text-slate-400 hover:text-white">INFOS MATCH</button>
      <button id="tab-resultats" onclick="switchTab('resultats')" class="flex-1 py-3 text-sm font-bold text-center border-b-2 border-transparent text-slate-400 hover:text-white">RÉSULTATS J</button>
    </div>

    <div id="view-prono" class="p-6 space-y-6">
      
      <div class="flex items-center justify-around bg-[#0b132b] p-4 rounded-xl border border-slate-800">
        <div class="text-center w-1/3">
          <img id="team-home-logo" src="https://media.api-sports.io/football/teams/85.png" alt="PSG" class="w-12 h-12 mx-auto object-contain mb-1">
          <span id="team-home-name" class="text-xs font-bold block truncate">PSG</span>
        </div>
        <div class="text-center w-1/3">
          <span class="text-amber-400 font-black text-lg">VS</span>
        </div>
        <div class="text-center w-1/3">
          <img id="team-away-logo" src="https://media.api-sports.io/football/teams/0.png" alt="Adversaire" class="w-12 h-12 mx-auto object-contain mb-1">
          <span id="team-away-name" class="text-xs font-bold block truncate">Chargement...</span>
        </div>
      </div>

      <div class="bg-[#0b132b] p-3 rounded-lg text-center border border-slate-800">
        <span class="text-[10px] uppercase text-slate-400 block tracking-wider">Coup d'envoi dans</span>
        <span id="countdown" class="text-sm font-bold text-blue-400">Recherche du match...</span>
      </div>

      <form id="form-prono" onsubmit="submitPronostic(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-300">Ton Nom / Pseudo</label>
          <input type="text" id="nom-ami" required class="w-full bg-[#0b132b] border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1 text-slate-300">Buts Domicile</label>
            <input type="number" id="score-home" min="0" required class="w-full bg-[#0b132b] border border-slate-700 rounded-lg p-2.5 text-sm text-center text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1 text-slate-300">Buts Extérieur</label>
            <input type="number" id="score-away" min="0" required class="w-full bg-[#0b132b] border border-slate-700 rounded-lg p-2.5 text-sm text-center text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1 text-slate-300">Minute 1er But (départage)</label>
          <input type="number" id="minute-1er-but" min="1" max="120" required class="w-full bg-[#0b132b] border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>

        <button type="submit" id="btn-submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition-colors">
          Valider mon pronostic
        </button>
      </form>

      <div class="pt-4 border-t border-slate-700">
        <h3 class="text-xs font-bold uppercase text-slate-400 mb-3 tracking-wider">Pronostiqueurs inscrits :</h3>
        <ul id="list-parieurs" class="space-y-2 text-sm text-slate-300">
          <li class="text-slate-500 italic text-xs">Chargement des pronostics...</li>
        </ul>
      </div>
    </div>

    <div id="view-infos" class="p-6 space-y-4 hidden">
      <div class="bg-[#0b132b] p-4 rounded-xl border border-slate-800 space-y-3 text-sm">
        <div><span class="text-slate-400 block text-xs">Date & Heure :</span> <strong id="info-date">-</strong></div>
        <div><span class="text-slate-400 block text-xs">Compétition :</span> <strong id="info-round">-</strong></div>
        <div><span class="text-slate-400 block text-xs">Stade :</span> <strong id="info-stadium">-</strong></div>
        <div><span class="text-slate-400 block text-xs">Arbitre principal :</span> <strong id="info-referee">-</strong></div>
      </div>
    </div>

    <div id="view-resultats" class="p-6 hidden">
      <p class="text-center text-slate-400 text-sm italic">Les résultats seront mis à jour après la fin de la rencontre.</p>
    </div>

  </div>

  <script>
    // Config Supabase & API-Football
    const SUPABASE_URL = "https://bgcuxroguucumbveptvb.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnY3V4cm9ndXVjdW1idmVwdHZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAxNTMwNDMsImV4cCI6MjA1NTcyOTA0M30.4i4P8bE0gX0K2d3C1r2R4u5t6y7u8i9o0p1a2s3d4f5"; 
    const API_FOOTBALL_KEY = "15a5eabb2d17b76fb922cd808a574779";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentFixtureId = null;
    let timerInterval = null;

    // 1. Récupération directe du vrai prochain match PSG depuis l'API
    async function fetchNextPSGMatch() {
      try {
        const headers = { "x-apisports-key": API_FOOTBALL_KEY };
        
        // Requête élargie sur les 5 prochains matchs pour éviter les réponses vides de next=1
        let res = await fetch("https://v3.football.api-sports.io/fixtures?team=85&next=5", { headers });
        let data = await res.json();

        // Récupération du premier match qui n'a pas encore commencé
        let match = null;
        if (data.response && data.response.length > 0) {
          match = data.response.find(m => m.fixture.status.short === "NS" || m.fixture.status.short === "TBD") || data.response[0];
        }

        if (!match) {
          document.getElementById('countdown').innerText = "Aucun match à venir programmé.";
          return;
        }

        // Attribution de l'ID officiel du match API
        currentFixtureId = match.fixture.id;
        const matchDate = new Date(match.fixture.date);

        // Affichage des logos et noms de clubs
        document.getElementById('team-home-name').innerText = match.teams.home.name;
        document.getElementById('team-home-logo').src = match.teams.home.logo;
        document.getElementById('team-away-name').innerText = match.teams.away.name;
        document.getElementById('team-away-logo').src = match.teams.away.logo;

        // Informations détaillées
        document.getElementById('info-date').innerText = matchDate.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
        document.getElementById('info-round').innerText = `${match.league.name} - ${match.league.round}`;
        document.getElementById('info-stadium').innerText = `${match.fixture.venue.name || 'Stade inconnu'} (${match.fixture.venue.city || '-'})`;
        document.getElementById('info-referee').innerText = match.fixture.referee || 'Non désigné';

        // Lancement du compte à rebours
        startCountdown(matchDate);

        // Chargement des pronostics enregistrés pour cette rencontre
        loadParieurs();

      } catch (err) {
        console.error("Erreur lors de la récupération de l'API Football :", err);
        document.getElementById('countdown').innerText = "Erreur de connexion API";
      }
    }

    // 2. Compte à rebours du match
    function startCountdown(targetDate) {
      if (timerInterval) clearInterval(timerInterval);
      
      function updateTimer() {
        const now = new Date().getTime();
        const diff = targetDate.getTime() - now;

        if (diff <= 0) {
          document.getElementById('countdown').innerText = "Match en cours ou terminé !";
          clearInterval(timerInterval);
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('countdown').innerText = `${days}j ${hours}h ${minutes}m ${seconds}s`;
      }

      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    }

    // 3. Soumission du pronostic dans Supabase avec le fixture_id exact
    async function submitPronostic(e) {
      e.preventDefault();

      if (!currentFixtureId) {
        alert("Impossible d'enregistrer le pronostic : le match n'est pas encore identifié par l'API.");
        return;
      }

      const nom = document.getElementById('nom-ami').value.trim();
      const scoreHome = document.getElementById('score-home').value;
      const scoreAway = document.getElementById('score-away').value;
      const minute1erBut = document.getElementById('minute-1er-but').value;

      const { data, error } = await supabaseClient
        .from('pronostics')
        .insert([{
          nom_ami: nom,
          score_parier: `${scoreHome}-${scoreAway}`,
          minute_1er_but: parseInt(minute1erBut),
          fixture_id: currentFixtureId
        }]);

      if (error) {
        console.error("Erreur Supabase :", error);
        alert("Erreur d'enregistrement : " + error.message);
      } else {
        alert("Prono enregistré avec succès ! 🎉");
        document.getElementById('form-prono').reset();
        loadParieurs();
      }
    }

    // 4. Chargement des parieurs et de la cagnotte depuis Supabase
    async function loadParieurs() {
      if (!currentFixtureId) return;

      const { data, error } = await supabaseClient
        .from('pronostics')
        .select('*')
        .eq('fixture_id', currentFixtureId);

      if (error) {
        console.error("Erreur lecture Supabase :", error);
        return;
      }

      const listEl = document.getElementById('list-parieurs');
      const cagnotteEl = document.getElementById('cagnotte-amount');

      // Calcul de la cagnotte (5 € par pronostic enregistré)
      const count = data ? data.length : 0;
      cagnotteEl.innerText = `${count * 5} €`;

      if (!data || data.length === 0) {
        listEl.innerHTML = `<li class="text-slate-500 italic text-xs">Aucun pronostic pour le moment. Sois le premier !</li>`;
        return;
      }

      listEl.innerHTML = data.map(p => `
        <li class="flex justify-between items-center bg-[#0b132b] p-2.5 rounded border border-slate-800">
          <span class="font-bold text-slate-200">${p.nom_ami}</span>
          <span class="text-amber-400 font-mono font-bold">${p.score_parier} <span class="text-slate-500 text-xs">(${p.minute_1er_but}')</span></span>
        </li>
      `).join('');
    }

    // Gestion des onglets UI
    function switchTab(tab) {
      document.getElementById('view-prono').classList.add('hidden');
      document.getElementById('view-infos').classList.add('hidden');
      document.getElementById('view-resultats').classList.add('hidden');

      document.getElementById('tab-prono').className = "flex-1 py-3 text-sm font-bold text-center border-b-2 border-transparent text-slate-400";
      document.getElementById('tab-infos').className = "flex-1 py-3 text-sm font-bold text-center border-b-2 border-transparent text-slate-400";
      document.getElementById('tab-resultats').className = "flex-1 py-3 text-sm font-bold text-center border-b-2 border-transparent text-slate-400";

      if (tab === 'prono') {
        document.getElementById('view-prono').classList.remove('hidden');
        document.getElementById('tab-prono').className = "flex-1 py-3 text-sm font-bold text-center border-b-2 border-blue-500 text-blue-400";
      } else if (tab === 'infos') {
        document.getElementById('view-infos').classList.remove('hidden');
        document.getElementById('tab-infos').className = "flex-1 py-3 text-sm font-bold text-center border-b-2 border-blue-500 text-blue-400";
      } else if (tab === 'resultats') {
        document.getElementById('view-resultats').classList.remove('hidden');
        document.getElementById('tab-resultats').className = "flex-1 py-3 text-sm font-bold text-center border-b-2 border-blue-500 text-blue-400";
      }
    }

    // Initialisation au chargement de la page
    window.addEventListener('DOMContentLoaded', fetchNextPSGMatch);
  </script>
</body>
</html>
