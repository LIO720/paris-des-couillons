<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris des Couillons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center p-4 font-sans relative">
    
    <!-- Fond d'écran style stade assombri -->
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-950 via-slate-950 to-black opacity-80 pointer-events-none z-0"></div>

    <div class="w-full max-w-sm space-y-5 relative z-10 py-6">
        
        <!-- En-tête -->
        <header class="text-center space-y-3">
            <!-- Grand logo Champions League bien visible -->
            <div class="flex justify-center">
                <div class="w-20 h-20 bg-gradient-to-br from-blue-900 to-indigo-700 rounded-full flex items-center justify-center border-2 border-blue-400 shadow-xl shadow-blue-500/40 p-2">
                    <img src="https://upload.wikimedia.org/wikipedia/fr/thumb/b/bf/Logo_UEFA_Champions_League.svg/1200px-Logo_UEFA_Champions_League.svg.png" alt="Champions League" class="w-full h-full object-contain filter drop-shadow">
                </div>
            </div>
            
            <h1 class="text-xl font-black tracking-wider text-white uppercase border-b-2 border-red-600 inline-block pb-1">Paris des Couillons</h1>
            <p class="text-blue-300 text-[11px] font-bold uppercase tracking-widest">Champions League</p>
            
            <!-- Cagnotte -->
            <div class="pt-1">
                <div class="bg-slate-900/80 border border-slate-700 rounded-2xl px-4 py-2 inline-block shadow-lg">
                    <p class="text-[9px] tracking-widest text-slate-400 uppercase font-bold">Cagnotte</p>
                    <div class="text-lg font-black text-amber-400"><span id="total-cagnotte">5</span> €</div>
                </div>
            </div>
        </header>

        <!-- Carte principale du match -->
        <main class="bg-slate-900/90 backdrop-blur-md rounded-3xl p-5 shadow-2xl border border-slate-800 space-y-5">
            
            <!-- Info Match & Compte à rebours -->
            <div class="text-center space-y-2">
                <div class="text-[10px] font-bold text-blue-400 tracking-widest uppercase">Prochain Match</div>
                <div class="text-xs text-amber-400 font-bold">Tirage au sort le 27 août</div>
                
                <!-- Équipes avec grand logo PSG visible -->
                <div class="flex items-center justify-center space-x-4 pt-3">
                    <div class="flex flex-col items-center space-y-1">
                        <div class="w-16 h-16 bg-blue-950 rounded-full flex items-center justify-center border-2 border-blue-500 shadow-md p-1.5">
                            <img src="https://upload.wikimedia.org/wikipedia/fr/thumb/8/86/Paris_Saint-Germain_Logo.svg/1200px-Paris_Saint-Germain_Logo.svg.png" alt="PSG" class="w-full h-full object-contain">
                        </div>
                        <span class="text-xs font-bold text-white">PSG</span>
                    </div>

                    <span class="text-slate-500 font-bold text-sm">VS</span>

                    <div class="flex flex-col items-center space-y-1">
                        <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center border-2 border-slate-600 shadow-md">
                            <span class="text-xl">❓</span>
                        </div>
                        <span class="text-xs font-bold text-slate-400">À venir</span>
                    </div>
                </div>
            </div>
            
            <!-- Formulaire de pronostic -->
            <form id="prono-form" class="space-y-3.5 pt-1">
                
                <!-- Bloc Score -->
                <div class="text-center space-y-1.5">
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-blue-300">Votre Pronostic</label>
                    <div class="flex items-center justify-center space-x-3">
                        <input type="number" id="score-psg" min="0" required placeholder="0" class="w-14 h-14 bg-slate-950 border border-slate-700 rounded-2xl text-center text-xl font-bold text-white focus:outline-none focus:border-blue-500">
                        <span class="text-lg font-bold text-slate-600">-</span>
                        <input type="number" id="score-adv" min="0" required placeholder="0" class="w-14 h-14 bg-slate-950 border border-slate-700 rounded-2xl text-center text-xl font-bold text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <!-- Minute du 1er but -->
                <div>
                    <input type="number" id="minute" min="1" max="120" required placeholder="Minute du 1er but (ex: 34)" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Prénom -->
                <div>
                    <input type="text" id="nom" required placeholder="Votre Prénom" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Bouton de validation -->
                <button type="submit" class="w-full bg-blue-700 hover:bg-blue-600 font-bold py-3 rounded-xl transition shadow-lg shadow-blue-900/40 text-xs tracking-wider uppercase text-white">
                    Valider mon prono
                </button>
            </form>

            <div id="status" class="text-center text-[11px] font-semibold mt-1"></div>

            <!-- Liste des parieurs -->
            <div class="border-t border-slate-800/80 pt-4 mt-2">
                <h2 class="text-slate-400 text-[11px] uppercase font-bold mb-2.5 tracking-wider text-center">Qui a parié ?</h2>
                <div id="parieurs-list" class="flex flex-wrap gap-1.5 justify-center">
                    <span class="text-slate-500 italic text-[11px]">Chargement...</span>
                </div>
            </div>
        </main>
    </div>

    <!-- Script de connexion Supabase -->
    <script>
        const SUPABASE_URL = "https://bgcuxroguucumbveptvb.supabase.co";
        const SUPABASE_KEY = "VOTRE_CLE_PUBLIABLE_SUPABASE"; 
        const MISE_PAR_PERSONNE = 5;

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadParticipants() {
            const { data, error } = await supabaseClient
                .from('pronostics')
                .select('nom_ami');

            const listEl = document.getElementById('parieurs-list');
            const cagnotteEl = document.getElementById('total-cagnotte');

            if (error) {
                listEl.innerHTML = `<span class="text-red-400 text-[11px]">Erreur chargement</span>`;
                return;
            }

            if (data.length === 0) {
                listEl.innerHTML = `<span class="text-slate-500 text-[11px] italic">Aucun pari pour le moment.</span>`;
                cagnotteEl.innerText = "0";
            } else {
                listEl.innerHTML = data.map(p => `<span class="bg-slate-950 border border-slate-800 text-blue-300 px-2.5 py-1 rounded-lg text-[11px] font-semibold">${p.nom_ami}</span>`).join('');
                cagnotteEl.innerText = data.length * MISE_PAR_PERSONNE;
            }
        }

        loadParticipants();

        document.getElementById('prono-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            status.className = "text-center text-[11px] font-semibold mt-1 text-blue-400";
            status.innerText = "Enregistrement en cours...";

            const nom = document.getElementById('nom').value;
            const scorePsg = document.getElementById('score-psg').value;
            const scoreAdv = document.getElementById('score-adv').value;
            const scoreTotal = `${scorePsg}-${scoreAdv}`; 
            const minute = parseInt(document.getElementById('minute').value);

            const { data, error } = await supabaseClient
                .from('pronostics')
                .insert([{ 
                    nom_ami: nom, 
                    score_parier: scoreTotal, 
                    minute_1er_but: minute 
                }]);

            if (error) {
                status.className = "text-center text-[11px] font-semibold mt-1 text-red-400";
                status.innerText = "Erreur : " + error.message;
            } else {
                status.className = "text-center text-[11px] font-semibold mt-1 text-green-400";
                status.innerText = "Pronostic enregistré avec succès ! 🎉";
                e.target.reset();
                loadParticipants(); 
            }
        });
    </script>
</body>
</html>
