<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prono Champions League - Espace Amis</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 font-sans antialiased">

  <div class="max-w-md mx-auto space-y-6 pb-12">
    
    <!-- En-tête & Cagnotte -->
    <header class="flex items-center justify-between bg-slate-900/80 border border-slate-800/80 rounded-2xl p-4 shadow-xl backdrop-blur-md">
      <div>
        <h1 class="text-sm font-black tracking-wider uppercase text-blue-400">C1 Pronos</h1>
        <p class="text-[11px] text-slate-400">Le jeu entre amis</p>
      </div>
      <div class="text-right">
        <span class="text-[10px] uppercase font-bold text-slate-400 block">Cagnotte</span>
        <span id="cagnotte" class="text-lg font-black text-amber-400">0 €</span>
      </div>
    </header>

    <!-- Match Actif / Prochain Match -->
    <section class="bg-slate-900/80 border border-slate-800/80 rounded-3xl p-5 shadow-xl backdrop-blur-md space-y-4">
      <div class="flex items-center justify-between">
        <span class="text-[10px] font-bold uppercase tracking-wider text-blue-400 bg-blue-950/80 px-2.5 py-1 rounded-full border border-blue-800/50">Prochain Match</span>
        <span id="countdown" class="text-[11px] font-mono text-slate-400">Chargement...</span>
      </div>

      <!-- Affichage des équipes -->
      <div id="match-card" class="flex items-center justify-between py-2">
        <div class="flex flex-col items-center space-y-2 w-5/12 text-center cursor-pointer group" onclick="openClubModal('home')">
          <div id="home-logo-container" class="w-14 h-14 flex items-center justify-center bg-slate-950/50 rounded-2xl border border-slate-800 group-hover:border-blue-500 transition">
            <span class="text-xs text-slate-500">Logo</span>
          </div>
          <span id="home-name" class="text-xs font-bold text-slate-200 truncate w-full">Domicile</span>
        </div>

        <div class="flex flex-col items-center justify-center w-2/12">
          <span class="text-xs font-black text-slate-500 uppercase tracking-widest">VS</span>
        </div>

        <div class="flex flex-col items-center space-y-2 w-5/12 text-center cursor-pointer group" onclick="openClubModal('away')">
          <div id="away-logo-container" class="w-14 h-14 flex items-center justify-center bg-slate-950/50 rounded-2xl border border-slate-800 group-hover:border-blue-500 transition">
            <span class="text-xs text-slate-500">Logo</span>
          </div>
          <span id="away-name" class="text-xs font-bold text-slate-200 truncate w-full">Extérieur</span>
        </div>
      </div>
    </section>

    <!-- Formulaire de Pronostic -->
    <section class="bg-slate-900/80 border border-slate-800/80 rounded-3xl p-5 shadow-xl backdrop-blur-md space-y-4">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Votre Pronostic</h2>
      
      <form id="prono-form" class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-semibold text-slate-400 mb-1">Score Domicile</label>
            <input type="number" id="score1" min="0" required class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3 py-2 text-center text-sm font-bold text-white focus:outline-none focus:border-blue-500 transition">
          </div>
          <div>
            <label class="block text-[10px] font-semibold text-slate-400 mb-1">Score Extérieur</label>
            <input type="number" id="score2" min="0" required class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3 py-2 text-center text-sm font-bold text-white focus:outline-none focus:border-blue-500 transition">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-semibold text-slate-400 mb-1">Minute 1er but</label>
            <input type="number" id="minute" min="1" max="120" required class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3 py-2 text-center text-sm font-bold text-white focus:outline-none focus:border-blue-500 transition" placeholder="ex: 24">
          </div>
          <div>
            <label class="block text-[10px] font-semibold text-slate-400 mb-1">Votre Prénom</label>
            <input type="text" id="nom" required class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3 py-2 text-center text-sm font-bold text-white focus:outline-none focus:border-blue-500 transition" placeholder="Prénom">
          </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs uppercase tracking-wider py-3 rounded-xl shadow-lg shadow-blue-600/30 transition cursor-pointer">
          Valider mon prono (5€)
        </button>
      </form>

      <div id="status" class="text-center text-xs"></div>
    </section>

    <!-- Commentaire / Résultat Match -->
    <div id="winner-ai-comment-container" class="hidden bg-gradient-to-r from-blue-950/60 to-purple-950/60 border border-blue-800/60 rounded-3xl p-4 shadow-xl text-xs space-y-2">
      <h4 class="font-bold text-amber-400 uppercase tracking-wider text-[10px]">Analyse du match & Résultat</h4>
      <p id="winner-ai-comment-text" class="text-slate-300 leading-relaxed"></p>
    </div>

    <!-- Liste des Parieurs -->
    <section class="bg-slate-900/80 border border-slate-800/80 rounded-3xl p-5 shadow-xl backdrop-blur-md space-y-3">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Pronostics des amis</h2>
      <div id="parieurs-list" class="space-y-2 max-h-56 overflow-y-auto pr-1">
        <span class="text-slate-400 italic text-[11px] block text-center py-4">Chargement des pronostics...</span>
      </div>
    </section>

    <!-- Navigation Journées (Calendrier C1) -->
    <section class="bg-slate-900/80 border border-slate-800/80 rounded-3xl p-5 shadow-xl backdrop-blur-md space-y-3">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Calendrier Ligue des Champions</h2>
      <div id="matchdays-nav" class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none">
        <!-- Boutons générés dynamiquement -->
      </div>
      <div id="ai-resultats-container" class="pt-2">
        <!-- Matchs de la journée sélectionnée -->
      </div>
    </section>

    <!-- Classement C1 -->
    <section class="bg-slate-900/80 border border-slate-800/80 rounded-3xl p-5 shadow-xl backdrop-blur-md space-y-3">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Classement Général C1</h2>
      <div id="standings-container" class="pt-1">
        <!-- Classement chargé dynamiquement -->
      </div>
    </section>

  </div>

  <!-- Modal Infos Club -->
  <div id="club-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-5 shadow-2xl relative">
      <button onclick="closeClubModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white font-bold text-sm bg-slate-800 w-8 h-8 rounded-full flex items-center justify-center cursor-pointer">✕</button>
      <div id="club-modal-content" class="space-y-4">
        <!-- Contenu injecté dynamiquement -->
      </div>
    </div>
  </div>

  <!-- Script JavaScript -->
  <script>
    // --- CONFIGURATION ---
    const API_FOOTBALL_KEY = '15a5eabb2d17b76fb922cd808a574779';
    const SUPABASE_URL = 'https://bgcuxroguucumbveptvb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MuYlr1whhZ7eFS1D8LoP7Q_0NV70N1X';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentFixtureId = null;
    let currentMatchFinished = false;
    let realHomeGoals = 0;
    let realAwayGoals = 0;
    let allClFixtures = [];
    let matchdaysChunks = [];
    let homeTeamData = null;
    let awayTeamData = null;

    // Charger le prochain match de C1
    async function fetchNextPSGMatch() {
      try {
        const response = await fetch(`https://v3.football.api-sports.io/fixtures?league=2&season=2026&next=1`, {
          headers: { "x-apisports-key": API_FOOTBALL_KEY }
        });
        const data = await response.json();

        if (data.response && data.response.length > 0) {
          const match = data.response[0];
          currentFixtureId = match.fixture.id;
          const matchDate = new Date(match.fixture.date);

          homeTeamData = match.teams.home;
          awayTeamData = match.teams.away;

          // Remplissage UI
          document.getElementById('home-logo-container').innerHTML = `<img src="${homeTeamData.logo}" alt="${homeTeamData.name}" class="w-10 h-10 object-contain">`;
          document.getElementById('home-name').innerText = homeTeamData.name;

          document.getElementById('away-logo-container').innerHTML = `<img src="${awayTeamData.logo}" alt="${awayTeamData.name}" class="w-10 h-10 object-contain">`;
          document.getElementById('away-name').innerText = awayTeamData.name;

          // Statut du match
          currentMatchFinished = (match.fixture.status.short === 'FT');
          if (currentMatchFinished) {
            realHomeGoals = match.goals.home;
            realAwayGoals = match.goals.away;
          }

          startCountdown(matchDate);
          loadParieurs();
        }
      } catch (err) {
        console.error("Erreur chargement match:", err);
      }

      initMatchdaysNav();
      fetchStandings();
    }

    async function openClubModal(side) {
      const modal = document.getElementById('club-modal');
      const content = document.getElementById('club-modal-content');
      const team = side === 'home' ? homeTeamData : awayTeamData;
      if (!modal || !content || !team) return;

      modal.classList.remove('hidden');
      content.innerHTML = `<div class="text-center text-slate-400 py-10">Chargement des infos du club...</div>`;

      try {
        const [resTeam, resSquad] = await Promise.all([
          fetch(`https://v3.football.api-sports.io/teams?id=${team.id}`, { headers: { "x-apisports-key": API_FOOTBALL_KEY } }),
          fetch(`https://v3.football.api-sports.io/players/squads?team=${team.id}`, { headers: { "x-apisports-key": API_FOOTBALL_KEY } })
        ]);

        const dataTeam = await resTeam.json();
        const dataSquad = await resSquad.json();

        if (dataTeam.response && dataTeam.response.length > 0) {
          const tInfo = dataTeam.response[0].team;
          const venue = dataTeam.response[0].venue;
          let squadList = dataSquad.response && dataSquad.response.length > 0 ? dataSquad.response[0].players || [] : [];

          content.innerHTML = `
            <div class="text-center space-y-3">
              <img src="${tInfo.logo}" alt="${tInfo.name}" class="w-16 h-16 object-contain mx-auto drop-shadow-lg">
              <div>
                <h3 class="text-base font-black text-white">${tInfo.name}</h3>
                <p class="text-xs text-blue-400 font-semibold">${tInfo.country} • Fondé en ${tInfo.founded || 'N/C'}</p>
              </div>
            </div>
            <div class="bg-slate-950/70 border border-slate-800 rounded-2xl p-4 space-y-2 text-xs">
              <div class="flex justify-between border-b border-slate-800 pb-1.5">
                <span class="text-slate-400">Stade</span>
                <span class="font-semibold text-white">${venue.name} (${venue.capacity ? venue.capacity.toLocaleString() + ' places' : ''})</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400">Ville</span>
                <span class="font-semibold text-white">${venue.city || 'N/C'}</span>
              </div>
            </div>
            <div class="space-y-2">
              <h4 class="font-bold text-slate-300 uppercase tracking-wider text-[10px]">Effectif (${squadList.length} joueurs)</h4>
              <div class="max-h-48 overflow-y-auto space-y-1 pr-1">
                ${squadList.map(p => `
                  <div class="flex justify-between items-center bg-slate-950/50 px-3 py-1.5 rounded-xl border border-slate-800 text-xs">
                    <span class="font-semibold text-slate-200">${p.name} <span class="text-[10px] text-slate-400">(${p.position})</span></span>
                    <span class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded font-mono text-[10px]">#${p.number || '-'}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }
      } catch (err) {
        content.innerHTML = `<div class="text-center text-red-400 py-10">Erreur lors de la récupération des données.</div>`;
      }
    }

    function closeClubModal() {
      const modal = document.getElementById('club-modal');
      if (modal) modal.classList.add('hidden');
    }

    async function getCagnotteSupabase() {
      const { data } = await supabaseClient.from('cagnotte_globale').select('montant').eq('id', 1).single();
      return data ? data.montant : 0;
    }

    async function setCagnotteSupabase(nouveauMontant) {
      await supabaseClient.from('cagnotte_globale').update({ montant: nouveauMontant }).eq('id', 1);
    }

    async function loadParieurs() {
      const listDiv = document.getElementById('parieurs-list');
      const cagnotteSpan = document.getElementById('cagnotte');
      if (!listDiv) return;

      try {
        const montantCagnotte = await getCagnotteSupabase();
        if (cagnotteSpan) cagnotteSpan.innerText = montantCagnotte + " €";

        if (!currentFixtureId) {
          listDiv.innerHTML = `<span class="text-slate-400 italic text-[11px] block text-center">Aucun match actif.</span>`;
          return;
        }

        const { data: pronos, error } = await supabaseClient.from('pronostics').select('*').eq('fixture_id', currentFixtureId).order('id', { ascending: false });

        if (error || !pronos || pronos.length === 0) {
          listDiv.innerHTML = `<span class="text-slate-400 italic text-[11px] block text-center">Soyez le premier à pronostiquer !</span>`;
          return;
        }

        listDiv.innerHTML = pronos.map(p => {
          let isExact = false;
          if (currentMatchFinished) {
            const [ph, pa] = p.score_parier.split('-').map(Number);
            isExact = (ph === realHomeGoals && pa === realAwayGoals);
          }

          const displayScore = currentMatchFinished ? p.score_parier : '🔒 masqué';
          const displayMin = currentMatchFinished ? p.minute_1er_but + "'" : '🔒';

          return `
            <div class="bg-slate-950/70 border ${isExact ? 'border-amber-500 bg-amber-500/15' : 'border-slate-800'} rounded-xl p-2.5 flex items-center justify-between text-xs">
              <div class="flex items-center space-x-2">
                <span class="font-bold text-white">${p.nom_ami}</span>
                ${isExact ? '<span class="bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded font-black text-[9px] uppercase">Exact 🏆</span>' : ''}
              </div>
              <div class="flex items-center space-x-3">
                <span class="bg-blue-950/80 text-blue-300 px-2 py-0.5 rounded font-mono font-bold">${displayScore}</span>
                <span class="text-slate-400 text-[11px]">Min: <strong class="text-amber-400">${displayMin}</strong></span>
              </div>
            </div>
          `;
        }).join('');

        if (currentMatchFinished) {
          const commentContainer = document.getElementById('winner-ai-comment-container');
          const commentText = document.getElementById('winner-ai-comment-text');
          if (commentContainer && commentText) {
            const winners = pronos.filter(p => {
              const [ph, pa] = p.score_parier.split('-').map(Number);
              return ph === realHomeGoals && pa === realAwayGoals;
            });

            if (winners.length > 0) {
              commentText.innerText = `Score final : ${realHomeGoals}-${realAwayGoals}. Bravo à ${winners.map(w => w.nom_ami).join(', ')} qui remporte la cagnotte !`;
            } else {
              commentText.innerText = `Score final : ${realHomeGoals}-${realAwayGoals}. Aucun pronostic exact, la cagnotte est reportée au prochain match !`;
            }
            commentContainer.classList.remove('hidden');
          }
        }
      } catch (err) {
        listDiv.innerHTML = `<span class="text-red-400 italic text-[11px] block text-center">Erreur de chargement.</span>`;
      }
    }

    document.getElementById('prono-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const score1 = document.getElementById('score1').value;
      const score2 = document.getElementById('score2').value;
      const minute = document.getElementById('minute').value;
      const nom = document.getElementById('nom').value.trim();
      const statusDiv = document.getElementById('status');

      if (!currentFixtureId) {
        statusDiv.innerHTML = `<span class="text-red-400">Aucun match actif sélectionné.</span>`;
        return;
      }

      statusDiv.innerHTML = `<span class="text-blue-400">Enregistrement...</span>`;

      try {
        const scoreParier = `${score1}-${score2}`;
        const { error } = await supabaseClient.from('pronostics').insert([{
          fixture_id: currentFixtureId,
          nom_ami: nom,
          score_parier: scoreParier,
          minute_1er_but: parseInt(minute)
        }]);

        if (error) throw error;

        const currentCagnotte = await getCagnotteSupabase();
        await setCagnotteSupabase(currentCagnotte + 5);

        statusDiv.innerHTML = `<span class="text-green-400">Prono validé ! 5€ ajoutés à la cagnotte.</span>`;
        document.getElementById('prono-form').reset();
        loadParieurs();
      } catch (err) {
        statusDiv.innerHTML = `<span class="text-red-400">Erreur lors de l'enregistrement.</span>`;
      }
    });

    function startCountdown(matchDate) {
      const countdownEl = document.getElementById('countdown');
      if (!countdownEl) return;

      function updateTimer() {
        const now = new Date();
        const diff = matchDate - now;

        if (diff <= 0) {
          countdownEl.innerText = "Match en cours / terminé";
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        countdownEl.innerText = `${days}j ${hours}h ${minutes}m ${seconds}s`;
      }
      updateTimer();
      setInterval(updateTimer, 1000);
    }

    async function initMatchdaysNav() {
      const navContainer = document.getElementById('matchdays-nav');
      const resultatsContainer = document.getElementById('ai-resultats-container');
      if (!navContainer || !resultatsContainer) return;

      if (allClFixtures.length === 0) {
        try {
          const response = await fetch(`https://v3.football.api-sports.io/fixtures?league=2&season=2026`, {
            headers: { "x-apisports-key": API_FOOTBALL_KEY }
          });
          const data = await response.json();
          if (data.response) {
            allClFixtures = data.response.filter(m => {
              const r = (m.league.round || '').toLowerCase();
              return !r.includes('qualifying') && !r.includes('play-off') && !r.includes('knockout');
            });
          }
        } catch (err) {}
      }

      matchdaysChunks = [];
      for (let i = 0; i < 8; i++) {
        matchdaysChunks.push({
          name: `Journée ${i + 1}`,
          fixtures: allClFixtures.slice(i * 9, (i + 1) * 9)
        });
      }

      navContainer.innerHTML = matchdaysChunks.map((chunk, idx) => `
        <button onclick="selectMatchday(${idx})" id="btn-md-${idx}" class="px-3 py-2 rounded-xl text-[10px] font-bold uppercase tracking-wider transition bg-slate-900 text-slate-300 border border-slate-800 shrink-0 cursor-pointer">
          J${idx + 1}
        </button>
      `).join('');

      if (matchdaysChunks.length > 0) selectMatchday(0);
    }

    window.selectMatchday = function(idx) {
      const chunk = matchdaysChunks[idx];
      const container = document.getElementById('ai-resultats-container');
      if (!container || !chunk) return;

      for (let i = 0; i < matchdaysChunks.length; i++) {
        const btn = document.getElementById(`btn-md-${i}`);
        if (btn) {
          btn.className = (i === idx) 
            ? "px-3 py-2 rounded-xl text-[10px] font-bold uppercase tracking-wider transition bg-blue-600 text-white shadow-md shrink-0 cursor-pointer"
            : "px-3 py-2 rounded-xl text-[10px] font-bold uppercase tracking-wider transition bg-slate-900 text-slate-300 border border-slate-800 shrink-0 cursor-pointer";
        }
      }

      if (chunk.fixtures.length === 0) {
        container.innerHTML = `<span class="text-slate-400 italic text-[11px] block text-center py-6">Aucun match programmé.</span>`;
        return;
      }

      container.innerHTML = `
        <div class="space-y-2 max-h-56 overflow-y-auto pr-1">
          ${chunk.fixtures.map(m => {
            const matchDate = new Date(m.fixture.date).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            const hGoals = m.goals.home !== null ? m.goals.home : '-';
            const aGoals = m.goals.away !== null ? m.goals.away : '-';
            const isFinished = m.fixture.status.short === 'FT';
            
            return `
              <div class="bg-slate-950/70 border border-slate-800 rounded-2xl p-3 flex items-center justify-between text-xs shadow-md">
                <div class="flex items-center space-x-2 w-5/12 truncate">
                  <img src="${m.teams.home.logo}" class="w-5 h-5 object-contain shrink-0">
                  <span class="truncate font-semibold text-slate-200">${m.teams.home.name}</span>
                </div>
                <div class="flex flex-col items-center justify-center px-2 shrink-0">
                  <span class="font-black text-amber-400 text-sm">${hGoals} - ${aGoals}</span>
                  <span class="text-[9px] text-slate-400">${isFinished ? 'Terminé' : matchDate}</span>
                </div>
                <div class="flex items-center justify-end space-x-2 w-5/12 truncate">
                  <span class="truncate font-semibold text-slate-200 text-right">${m.teams.away.name}</span>
                  <img src="${m.teams.away.logo}" class="w-5 h-5 object-contain shrink-0">
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    };

    async function fetchStandings() {
      const container = document.getElementById('standings-container');
      if (!container) return;

      container.innerHTML = `<span class="text-slate-400 italic text-[11px] block text-center py-6">Chargement du classement...</span>`;

      try {
        const response = await fetch(`https://v3.football.api-sports.io/standings?league=2&season=2026`, {
          headers: { "x-apisports-key": API_FOOTBALL_KEY }
        });
        const data = await response.json();

        if (data.response && data.response.length > 0) {
          const standings = data.response[0].league.standings[0] || [];
          container.innerHTML = `
            <div class="space-y-1 max-h-64 overflow-y-auto pr-1">
              ${standings.map(s => `
                <div class="flex items-center justify-between bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-xs">
                  <div class="flex items-center space-x-3 truncate">
                    <span class="font-mono font-bold text-slate-400 w-5 text-right">${s.rank}</span>
                    <img src="${s.team.logo}" class="w-5 h-5 object-contain">
                    <span class="font-semibold text-white truncate">${s.team.name}</span>
                  </div>
                  <div class="flex items-center space-x-3 shrink-0 font-mono text-[11px]">
                    <span class="text-slate-400">J: <strong class="text-slate-200">${s.all.played}</strong></span>
                    <span class="text-slate-400">Pts: <strong class="text-blue-400">${s.points}</strong></span>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = `<span class="text-red-400 italic text-[11px] block text-center py-6">Erreur de chargement.</span>`;
      }
    }

    // Lancement de l'application au chargement
    fetchNextPSGMatch();
  </script>
</body>
</html>
